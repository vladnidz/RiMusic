name: Build Watch Compatible RiMusic APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "gradle"

      - name: Build Armeabi-v7a RiMusic APK
        run: ./gradlew :composeApp:assembleFullRelease

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp composeApp/build/outputs/apk/full/release/*.apk release-output/RiMusic-Watch-v0.6.76.apk
          ls -lh release-output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.76-watch
          name: "RiMusic v0.6.76 for Huawei Watch 3 Pro"
          body: |
            ### RiMusic v0.6.76 (Refactored Streaming & Direct YouTube Engine)
            - **No Stream Timeout**: New refactored streaming process bypassing YouTube 403 / poToken restrictions.
            - **Compatible with Huawei Watch 3 Pro**: 32-bit armeabi-v7a support.
            - **Offline Downloads & Cache**: Save tracks directly to watch internal storage.
          files: release-output/RiMusic-Watch-v0.6.76.apk
